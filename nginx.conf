server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache immutable hashed assets from Astro
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache static images and fonts
    location ~* \.(?:svg|ico|png|webp|jpg|jpeg|gif|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Clean URLs and fallback to index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Healthcheck endpoint for Docker / reverse proxy
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    error_page 404 /index.html;
}
